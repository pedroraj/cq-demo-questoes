<pl-question-panel>
  <p>Na convenção de chamada do RISC-V, qual registrador guarda o endereço de retorno de uma função?</p>
</pl-question-panel>

<pl-multiple-choice answers-name="registrador">
  <pl-answer correct="true"><code>ra</code> (<code>x1</code>)</pl-answer>
  <pl-answer correct="false"><code>sp</code> (<code>x2</code>)</pl-answer>
  <pl-answer correct="false"><code>a0</code> (<code>x10</code>)</pl-answer>
  <pl-answer correct="false"><code>t0</code> (<code>x5</code>)</pl-answer>
</pl-multiple-choice>
